[project]
name = "cfjson"
version = "0.4.2"
description = "CF-JSON converters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.23.0",
    "pandas>=1.5.0",
    "python-dateutil>=2.7.0",
    "six>=1.12.0",
    "xarray>=2024.6.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.3",
    "mock>=5.2.0",
    "netcdf4>=1.7.4",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "tox>=4.61.4",
    "tox-uv>=1.36.0",
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
