[project]
name = "cfjson"
version = "0.4.2"
description = "CF-JSON converters"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jupyterlab>=4.6.2",
    "numpy==2.5.1",
    "packaging==26.3",
    "pandas==3.0.5",
    "python-dateutil==2.9.0.post0",
    "six==1.17.0",
    "xarray==2026.7.0",
]

[dependency-groups]
dev = [
    "mock>=5.2.0",
    "netcdf4>=1.7.4",
    "pandas>=3.0.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "xarray>=2026.7.0",
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
